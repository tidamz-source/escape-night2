<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier Carte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Atelier de nuit : outils à gauche, la carte au centre, l'inspecteur à droite */
:root {
  --ink: #121019; --panel: #1b1826; --panel2: #24202f; --line: #353047; --fg: #ebe7f5; --mute: #9a93ae;
  --accent: #ffd45c; --accent-ink: #2a2006; --ok: #5fe0a0; --danger: #ff6b6b;
  --c-wall: #ff4646; --c-water: #3a86ff; --c-exit: #ffe14a; --c-door: #5fe0a0; --c-arr: #c38bff; --c-poly: #ff5fb0; --c-base: #36e0ff;
  --f-pix: "Silkscreen", "IBM Plex Mono", monospace; --f-ui: "IBM Plex Sans", system-ui, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--fg); font: 13px/1.4 var(--f-ui); overflow: hidden }
button, input, select, textarea { font: inherit; color: inherit }
#app { display: grid; grid-template-columns: 252px minmax(0, 1fr) 272px; grid-template-rows: 46px minmax(0, 1fr); height: 100vh }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0 }
header h1 { font: 14px var(--f-pix); color: var(--accent); margin: 0 6px 0 0; white-space: nowrap }
header .doc { font: 12px var(--f-mono); color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
header .sp { flex: 1 }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; white-space: nowrap }
.btn:hover { border-color: var(--mute) }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.dan { color: var(--danger) }
.btn:disabled { opacity: .4; cursor: default }
aside { background: var(--panel); overflow-y: auto; min-height: 0 }
#left { border-right: 1px solid var(--line); padding: 10px }
#right { border-left: 1px solid var(--line); padding: 12px }
.sect { font: 10px var(--f-pix); color: var(--mute); letter-spacing: .06em; margin: 14px 0 6px }
.sect:first-child { margin-top: 0 }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 5px }
.modes .btn { text-align: left; padding: 6px 8px }
.modes .btn kbd { float: right; font: 10px var(--f-mono); opacity: .6 }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 5px 0 }
.lib { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px }
.lib .it { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 3px; cursor: grab; display: grid; place-items: center; aspect-ratio: 1; position: relative; overflow: hidden }
.lib .it.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
.lib .it img { max-width: 92%; max-height: 74%; image-rendering: pixelated; pointer-events: none }
.lib .it span { position: absolute; bottom: 1px; left: 2px; right: 2px; font: 9px var(--f-mono); color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center }
.lib .it .rm { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 5px; border: 0; background: rgba(18,16,25,.85); color: var(--danger); font-size: 11px; line-height: 18px; padding: 0; cursor: pointer; opacity: 0; transition: opacity .15s }
.lib .it:hover .rm, .lib .it:focus-within .rm { opacity: 1 }
@media (hover: none) { .lib .it .rm { opacity: 1 } }
.lib .it.new::after { content: "nouveau"; position: absolute; top: 2px; right: 2px; font: 8px var(--f-mono); background: var(--ok); color: #062; padding: 0 3px; border-radius: 3px }
#libcat { width: 100% }
#stage { position: relative; overflow: hidden; background: #0b0a10; min-width: 0; min-height: 0 }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none }
#hud { position: absolute; left: 10px; bottom: 10px; font: 11px var(--f-mono); color: var(--mute); background: rgba(18,16,25,.8); padding: 4px 8px; border-radius: 6px; pointer-events: none }
#toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 6px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none }
#toast.show { opacity: 1 }
.field { display: grid; gap: 3px; margin: 8px 0 }
.field label { font-size: 11px; color: var(--mute) }
.field input, .field select, .field textarea { background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; width: 100% }
.field textarea { min-height: 60px; resize: vertical }
.chk { display: flex; gap: 7px; align-items: center; margin: 6px 0 }
.small { font-size: 11px; color: var(--mute) }
.legend { display: grid; gap: 3px; font-size: 11px; color: var(--mute) }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px }
dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 18px; width: min(560px, 92vw); max-height: 86vh; overflow: auto }
dialog::backdrop { background: rgba(0,0,0,.6) }
dialog h2 { font: 14px var(--f-pix); color: var(--accent); margin: 0 0 10px }
dialog .list { display: grid; gap: 6px; margin: 6px 0 14px }
dialog .list .btn { text-align: left; display: flex; justify-content: space-between; gap: 10px }
dialog .list .btn small { color: var(--mute) }
.warn { color: var(--danger); font-size: 12px }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Atelier Carte</h1>
    <span class="doc" id="docname">aucune carte</span>
    <span class="sp"></span>
    <button class="btn" id="bUndo" title="Ctrl+Z">↶</button><button class="btn" id="bRedo" title="Ctrl+Maj+Z">↷</button>
    <button class="btn" id="bFondTop">Fond…</button>
    <button class="btn" id="bOpen">Ouvrir…</button>
    <button class="btn" id="bNew">Nouvelle</button>
    <button class="btn pri" id="bExport">Exporter le zip</button>
  </header>
  <aside id="left">
    <div class="sect">Outils</div>
    <div class="modes" id="modes"></div>
    <p class="small" id="hint" style="margin:8px 0 0"></p>
    <div id="leftmode"></div>
    <div class="sect">Affichage</div>
    <label class="chk"><input type="checkbox" id="vCol" checked> Collisions</label>
    <label class="chk"><input type="checkbox" id="vBase" checked> Lignes de pied</label>
    <label class="chk"><input type="checkbox" id="vGrid"> Grille 16 px</label>
    <label class="chk"><input type="checkbox" id="vSnap" checked> Aimant 16 px <span class="small">(Maj = libre)</span></label>
    <div class="legend" style="margin-top:8px">
      <div><i style="background:var(--c-wall)"></i>Mur / obstacle</div><div><i style="background:var(--c-water)"></i>Eau</div>
      <div><i style="background:var(--c-poly)"></i>Collision d'objet</div><div><i style="background:var(--c-base)"></i>Ligne de pied</div>
      <div><i style="background:var(--c-door)"></i>Porte</div><div><i style="background:var(--c-exit)"></i>Sortie</div><div><i style="background:var(--c-arr)"></i>Arrivée</div><div><i style="background:#ff9c1a"></i>Pont</div>
    </div>
  </aside>
  <main id="stage"><canvas id="cv"></canvas><div id="hud"></div><div id="toast"></div></main>
  <aside id="right"><div id="insp"></div></aside>
</div>

<dialog id="dlgOpen"><h2>Ouvrir une carte</h2><div id="openBody"></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="dlgOpen.close()">Fermer</button></div></dialog>
<dialog id="dlgNew"><h2>Nouvelle carte</h2>
  <div class="field"><label>Identifiant (zone du jeu : lac, dunes, royaume…)</label><input id="nId" placeholder="lac"></div>
  <div class="field"><label>Nom affiché</label><input id="nName" placeholder="Le Lac"></div>
  <div class="field"><label>Fond (image ×2 : 32 px par case)</label><input id="nFond" type="file" accept="image/*"></div>
  <div class="row"><div class="field" style="flex:1"><label>Largeur (cases)</label><input id="nCols" type="number" value="64" min="8"></div><div class="field" style="flex:1"><label>Hauteur (cases)</label><input id="nRows" type="number" value="48" min="8"></div></div>
  <p class="small">Avec un fond, la taille se règle d'après l'image.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="dlgNew.close()">Annuler</button><button class="btn pri" id="nGo">Créer</button></div>
</dialog>
<dialog id="dlgImp"><h2>Importer des PNG</h2>
  <p class="small" id="impList"></p>
  <div class="field"><label>Catégorie</label><select id="impCat"><option>Bâtiments</option><option>Arbres</option><option>Rochers</option><option>Décor</option></select></div>
  <div class="field"><label>Échelle de l'image</label><select id="impScale"><option value="0.5">×2 (comme les cartes peintes) — recommandé</option><option value="1">×1 (pixel = pixel du jeu)</option></select></div>
  <label class="chk"><input type="checkbox" id="impFade" checked> Transparent quand on passe derrière</label>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="dlgImp.close()">Annuler</button><button class="btn pri" id="impGo">Ajouter à la bibliothèque</button></div>
</dialog>
<input type="file" id="fileImp" accept="image/png,image/*" multiple hidden>
<input type="file" id="fileFond" accept="image/*" hidden>
<input type="file" id="fileVis" accept="image/png,image/*" hidden>
<input type="file" id="filePont" accept="image/*" multiple hidden>
<input type="file" id="fileZip" accept=".zip" hidden>

<script>
'use strict';
const ROOT = '../../', TS = 16, FTS = 4;
const $ = id => document.getElementById(id);
const ZONES = ['royaume', 'collines', 'foret', 'montagne', 'lac', 'cote', 'terres', 'camp', 'route_nord', 'col', 'oree', 'pres', 'dunes', 'lande', 'sanctuaire', 'cave', 'bois', 'mines', 'temple', 'tower', 'castle'];
const INTERIEURS = ['auberge', 'bibliotheque', 'forge', 'epicerie', 'mamie', 'comptoir', 'pierrette', 'gaspard', 'mahaut', 'berger', 'bucheron', 'herboriste', 'gnome', 'pecheur', 'artificiere', 'ermite', 'bungalow', 'phare1'];
const GAME_MAPS = [['royaume', 'royaume', 'Bourg-Luciole'], ['collines', 'collines', 'Les Collines'], ['cote', 'cote', 'La Côte'], ['camping', 'camp', 'Le Camping'], ['route_nord', 'route_nord', 'La Route des Bergers'], ['dunes', 'dunes', 'Les Dunes']];
const REPO_MODELS = [
  ['assets/props/oak1.png', 'Chêne 1', 'Arbres'], ['assets/props/oak2.png', 'Chêne 2', 'Arbres'], ['assets/props/pine1.png', 'Sapin 1', 'Arbres'], ['assets/props/pine2.png', 'Sapin 2', 'Arbres'],
  ['assets/deco/dead.png', 'Arbre mort', 'Arbres'], ['assets/deco/stump.png', 'Souche', 'Arbres'], ['assets/props/bush.png', 'Buisson', 'Décor'], ['assets/props/flowers.png', 'Fleurs', 'Décor'],
  ['assets/props/rock.png', 'Rocher', 'Rochers'], ['assets/deco/secretrock.png', 'Gros rocher', 'Rochers'], ['assets/deco/grave.png', 'Tombe', 'Rochers'],
  ['assets/props/log.png', 'Bûche', 'Décor'], ['assets/props/fence.png', 'Barrière', 'Décor'], ['assets/props/lamp.png', 'Réverbère', 'Décor'], ['assets/props/sign.png', 'Panneau', 'Décor'],
  ['assets/props/table.png', 'Table', 'Décor'], ['assets/props/campfire.png', 'Feu de camp', 'Décor'], ['assets/props/tent_b.png', 'Tente bleue', 'Bâtiments'], ['assets/props/tent_r.png', 'Tente rouge', 'Bâtiments'], ['assets/props/tent_y.png', 'Tente jaune', 'Bâtiments'],
  ['assets/deco/windmill.png', 'Moulin', 'Bâtiments'], ['assets/deco/lighthouse.png', 'Phare', 'Bâtiments'], ['assets/deco/shrine.png', 'Sanctuaire', 'Bâtiments'], ['assets/deco/glowshroom.png', 'Champignon', 'Décor'],
];
const MODES = [['obj', 'Objets', '1'], ['sol', 'Sol', '2'], ['porte', 'Portes', '3'], ['sortie', 'Sorties', '4'], ['arrivee', 'Arrivées', '5'], ['item', 'Coffres…', '6'], ['test', 'Tester', '7'], ['pont', 'Ponts', '8']];
const ITEM_TYPES = [['coffre', 'Coffre'], ['pot', 'Pot'], ['buisson', 'Buisson'], ['panneau', 'Panneau']];

// ---------- état ----------
let S = null;             // la carte : { id, name, cols, rows, dark, grille[], objets[], portes[], sorties[], arrivees[], items[], depart }
let FOND = null;          // image du fond
let fondBlob = null;      // fichier du fond (pour l'export)
const MODELS = new Map(); // src -> { src, nom, cat, s, base, poly, fade, img, mask, isNew, blob }
let mode = 'obj', sel = null, brush = { t: '#', r: 1 }, itemType = 'coffre', placing = null;
const view = { z: 1, ox: 0, oy: 0 };
let undo = [], redo = [];
const cv = $('cv'), cx = cv.getContext('2d');

function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2200); }
const uid = () => Math.random().toString(36).slice(2, 8);
const snapOn = e => $('vSnap').checked && !(e && e.shiftKey);
const snap = (v, e, g = TS) => snapOn(e) ? Math.round(v / g) * g : Math.round(v);
function loadImg(src) { return new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; }); }
function blobToImg(b) { return loadImg(URL.createObjectURL(b)); }

// ---------- stockage local (brouillons + modèles importés) ----------
function idb() { return new Promise((ok, ko) => { const r = indexedDB.open('atelier-carte', 1); r.onupgradeneeded = () => { r.result.createObjectStore('docs'); r.result.createObjectStore('models'); }; r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); }
async function idbPut(st, k, v) { const d = await idb(); return new Promise(ok => { const tx = d.transaction(st, 'readwrite'); tx.objectStore(st).put(v, k); tx.oncomplete = ok; tx.onerror = ok; }); }
async function idbDel(st, k) { const d = await idb(); return new Promise(ok => { const tx = d.transaction(st, 'readwrite'); tx.objectStore(st).delete(k); tx.oncomplete = ok; tx.onerror = ok; }); }
async function idbAll(st) { const d = await idb(); return new Promise(ok => { const out = {}, tx = d.transaction(st), c = tx.objectStore(st).openCursor(); c.onsuccess = () => { const x = c.result; if (x) { out[x.key] = x.value; x.continue(); } }; tx.oncomplete = () => ok(out); tx.onerror = () => ok({}); }); }
let saveT = 0;
function autosave() { clearTimeout(saveT); saveT = setTimeout(() => { if (S) idbPut('docs', S.id, { state: JSON.parse(JSON.stringify(S)), fond: fondBlob, at: Date.now() }); }, 600); }

// ---------- modèles (bibliothèque) ----------
function mask(img) { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const g = c.getContext('2d'); g.drawImage(img, 0, 0); return g.getImageData(0, 0, c.width, c.height).data; }
function defaultFoot(img, s) { // ligne de pied : le bas des pixels opaques ; collision : une boîte au pied
  const d = mask(img); let bottom = img.height - 1;
  outer: for (let y = img.height - 1; y >= 0; y--) for (let x = 0; x < img.width; x++) if (d[(y * img.width + x) * 4 + 3] > 40) { bottom = y; break outer; }
  const base = bottom - Math.round(Math.min(6 / s, img.height * 0.08)), w = img.width, hh = Math.max(6 / s, Math.min(img.height * 0.25, 18 / s));
  return { base, poly: [[w * 0.22, base - hh], [w * 0.78, base - hh], [w * 0.78, base + 2 / s], [w * 0.22, base + 2 / s]].map(p => p.map(Math.round)) };
}
const LIGHT_RE = /lantern|lanterne|lamp|réverb|reverb|torche|torch|feu|campfire|bougie|candle/i;
function defaultLight(m) { // au-dessus du centre des pixels opaques : là où brûle la flamme
  const d = m.mask, W = m.img.width, H = m.img.height; let top = 0;
  outer: for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 40) { top = y; break outer; }
  return { x: Math.round(W / 2), y: Math.round(top + (H - top) * 0.22), r: 48, c: '#ffd27a', flick: true };
}
async function addModel(m) {
  try { m.img = m.img || await loadImg(m.url || ROOT + m.src); } catch (_) { return null; }
  m.mask = mask(m.img);
  if (m.lumiere === undefined && LIGHT_RE.test(m.src + ' ' + (m.nom || ''))) m.lumiere = defaultLight(m);
  if (m.base == null || !m.poly) Object.assign(m, defaultFoot(m.img, m.s), { base: m.base ?? defaultFoot(m.img, m.s).base });
  MODELS.set(m.src, m); return m;
}
// éléments retirés de la bibliothèque (ce navigateur) ; ceux du dépôt sortent aussi de assets/cartes/objets/index.json à l'export
let REMOVED = new Set(); try { REMOVED = new Set(JSON.parse(localStorage.getItem('atelier-carte-retires') || '[]')); } catch (_) {}
function saveRemoved() { try { localStorage.setItem('atelier-carte-retires', JSON.stringify([...REMOVED])); } catch (_) {} }
async function removeModel(m) {
  const n = S ? S.objets.filter(o => o.src === m.src).length : 0;
  if (!confirm(`Retirer « ${m.nom} » de la bibliothèque ?` + (n ? `\n\nIl est posé ${n} fois sur cette carte : ces exemplaires seront supprimés aussi.` : ''))) return;
  if (n) { commit(); S.objets = S.objets.filter(o => o.src !== m.src); if (sel && sel.k === 'obj' && sel.o.src === m.src) sel = null; }
  MODELS.delete(m.src); if (placing === m) placing = null;
  if (m.isNew) await idbDel('models', m.src);
  REMOVED.add(m.src); saveRemoved();
  renderLeft(); renderInsp(); autosave(); toast(`« ${m.nom} » retiré`);
}
async function loadLibrary() {
  for (const [src, nom, cat] of REPO_MODELS) if (!REMOVED.has(src)) await addModel({ src, nom, cat, s: 0.5, fade: cat === 'Arbres' || cat === 'Bâtiments' });
  try { const list = await fetch(ROOT + 'assets/cartes/objets/index.json', { cache: 'no-store' }).then(r => r.json()); for (const m of list) if (!REMOVED.has(m.src)) await addModel(Object.assign({}, m)); } catch (_) {}
  const local = await idbAll('models').catch(() => ({}));
  for (const k in local) { const m = local[k]; REMOVED.delete(k); await addModel(Object.assign({}, m, { url: URL.createObjectURL(m.blob), isNew: true })); }
  renderLeft();
}
function modelOf(o) { return MODELS.get(o.src); }

// ---------- carte ----------
function blankGrid(cols, rows) { return Array.from({ length: rows }, () => '.'.repeat(cols)); }
function newDoc(id, name, cols, rows) { return { id, name, cols, rows, dark: 0.4, ponts: [], grille: blankGrid(cols, rows), objets: [], portes: [], sorties: [], arrivees: [], items: [], depart: '' }; }
function setDoc(doc, fondImg, blob) {
  S = doc; FOND = fondImg; fondBlob = blob || null; sel = null; undo = []; redo = [];
  for (const k of ['objets', 'portes', 'sorties', 'arrivees', 'items', 'ponts']) S[k] = S[k] || [];
  $('docname').textContent = `${S.name || S.id} · ${S.id} · ${S.cols}×${S.rows} cases`;
  fit(); renderLeft(); renderInsp(); autosave();
}
function commit() { if (!S) return; undo.push(JSON.stringify(S)); if (undo.length > 80) undo.shift(); redo = []; autosave(); }
function doUndo() { if (!undo.length) return; redo.push(JSON.stringify(S)); S = JSON.parse(undo.pop()); sel = null; renderInsp(); autosave(); }
function doRedo() { if (!redo.length) return; undo.push(JSON.stringify(S)); S = JSON.parse(redo.pop()); sel = null; renderInsp(); autosave(); }
function setCell(tx, ty, t) { if (tx < 0 || ty < 0 || tx >= S.cols || ty >= S.rows) return; const r = S.grille[ty]; if (r[tx] === t) return; S.grille[ty] = r.slice(0, tx) + t + r.slice(tx + 1); }

// placer un objet depuis un modèle : (x, y) = milieu du pied, en px du monde
function placeModel(m, wx, wy, e) {
  const w = m.img.width * m.s, h = m.img.height * m.s;
  let x = wx - w / 2, y = wy - m.base * m.s;
  if (snapOn(e)) { x = Math.round(x / TS) * TS; const by = Math.round((y + m.base * m.s) / TS) * TS; y = by - m.base * m.s; }
  const o = { id: uid(), src: m.src, x: Math.round(x), y: Math.round(y), s: m.s, w: m.img.width, h: m.img.height, base: 0, poly: [], fade: !!m.fade, flip: false };
  o.base = Math.round(o.y + m.base * m.s); o.poly = m.poly.map(([px, py]) => [Math.round(o.x + px * m.s), Math.round(o.y + py * m.s)]);
  if (m.lumiere) o.lumiere = Object.assign({}, m.lumiere, { x: Math.round(o.x + m.lumiere.x * m.s), y: Math.round(o.y + m.lumiere.y * m.s) });
  if (m.pied) { o.pied = m.pied.map(([px, py]) => [Math.round(o.x + px * m.s), Math.round(o.y + py * m.s)]); syncBase(o); }
  S.objets.push(o); return o;
}
function moveObj(o, dx, dy) { if (o.lumiere) { o.lumiere.x += dx; o.lumiere.y += dy; } o.x += dx; o.y += dy; o.base += dy; o.poly = o.poly.map(([x, y]) => [x + dx, y + dy]); if (o.pied) o.pied = o.pied.map(([x, y]) => [x + dx, y + dy]); }
// ligne de pied : une ligne brisée (o.pied) ou, à défaut, un trait horizontal à o.base

  return w.length ? `<div class="sect">À compléter</div>` + w.map(t => `<p class="warn">${esc(t)}</p>`).join('') : `<p class="small" style="color:var(--ok)">Tout est prêt à exporter.</p>`;
}

// ---------- import de PNG ----------
let impFiles = [];
function askImport(files) { impFiles = files; $('impList').textContent = files.map(f => f.name).join(', '); $('dlgImp').showModal(); }
$('fileImp').onchange = e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) askImport(f); };
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\.[a-z0-9]+$/, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'objet';
function modelRecord(m) { return { src: m.src, nom: m.nom, cat: m.cat, s: m.s, base: m.base, poly: m.poly, lumiere: m.lumiere || null, pied: m.pied || null, fade: m.fade, blob: m.blob }; }
$('impGo').onclick = async () => {
  const cat = $('impCat').value, s = +$('impScale').value, fade = $('impFade').checked; let last = null;
  for (const f of impFiles) {
    let name = slug(f.name), src = `assets/cartes/objets/${name}.png`, n = 2; while (MODELS.has(src)) src = `assets/cartes/objets/${name}_${n++}.png`;
    const blob = f.type === 'image/png' ? f : await toPng(f);
    const m = await addModel({ src, nom: f.name.replace(/\.[^.]+$/, ''), cat, s, fade, url: URL.createObjectURL(blob), blob, isNew: true });
    if (m) { await idbPut('models', src, modelRecord(m)); REMOVED.delete(src); saveRemoved(); last = m; }
  }
  $('dlgImp').close(); libCat = cat; if (last) { placing = last; setMode('obj'); placing = last; } renderLeft(); renderInsp(); toast(impFiles.length + ' objet(s) ajouté(s)');
};
async function toPng(f) { const i = await blobToImg(f), c = document.createElement('canvas'); c.width = i.width; c.height = i.height; c.getContext('2d').drawImage(i, 0, 0); return new Promise(ok => c.toBlob(ok, 'image/png')); }

// ---------- ponts ----------
let pontOuvert = true, pontZone = false, pontRepl = null;
function drawPontImg(p, src) { const m = MODELS.get(src); if (m) cx.drawImage(m.img, p.x, p.y, p.w * p.s, p.h * p.s); }
async function pontModel(f, nom) {
  const blob = f.type === 'image/png' ? f : await toPng(f); let base = slug(f.name), src = `assets/cartes/objets/${base}.png`, n = 2; while (MODELS.has(src)) src = `assets/cartes/objets/${base}_${n++}.png`;
  const m = await addModel({ src, nom, cat: 'Ponts', s: 0.5, fade: false, url: URL.createObjectURL(blob), blob, isNew: true }); await idbPut('models', src, modelRecord(m)); return m;
}
// les fichiers se reconnaissent à leur nom : bridge_up (levé), bridge_down_BG (tablier), bridge_down_FG (piliers)
const PONT_KEYS = [['leve', /bridge[_ -]?up/i, 'Pont (levé)'], ['bg', /bridge[_ -]?down[_ -]?bg/i, 'Pont (tablier)'], ['fg', /bridge[_ -]?down[_ -]?fg/i, 'Pont (piliers)']];
const isPontFile = f => PONT_KEYS.some(([, re]) => re.test(f.name));
async function pontFromFiles(files) {
  if (!S) return toast('Ouvre ou crée d\'abord une carte');
  const got = {};
  for (const f of files) { const k = PONT_KEYS.find(([, re]) => re.test(f.name)); if (k) got[k[0]] = await pontModel(f, k[2]); }
  if (pontRepl) { // changer les images d'un pont existant
    const p = pontRepl; pontRepl = null; if (!Object.keys(got).length) return toast('Noms attendus : bridge_up, bridge_down_BG, bridge_down_FG');
    commit(); for (const k in got) p[k] = got[k].src; const ref = got.bg || got.leve || got.fg; p.w = ref.img.width; p.h = ref.img.height; renderInsp(); return toast('Images du pont mises à jour');
  }
  if (!got.bg || !got.fg) return toast('Il manque ' + [!got.bg && 'bridge_down_BG', !got.fg && 'bridge_down_FG'].filter(Boolean).join(' et '));
  const d = devicePixelRatio || 1, c = toW(cv.width / d / 2, cv.height / d / 2), bg = got.bg;
  commit(); const p = { id: uid(), leve: got.leve ? got.leve.src : null, bg: bg.src, fg: got.fg.src, s: 0.5, w: bg.img.width, h: bg.img.height, x: 0, y: 0, drapeau: 'drawbridge', charniere: 'droite', zone: null };
  p.x = Math.round((c.x - p.w * p.s / 2) / 8) * 8; p.y = Math.round((c.y - p.h * p.s / 2) / 8) * 8;
  S.ponts.push(p); if (mode !== 'pont') setMode('pont'); sel = { k: 'pont', o: p }; renderLeft(); renderInsp();
  toast('Pont ajouté au centre de la vue' + (got.leve ? '' : ' (sans bridge_up)') + ' : place-le puis trace sa zone');
}
$('filePont').onchange = e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) pontFromFiles(f); };

// ---------- mettre à jour le visuel d'un modèle ----------
// nouvelle image : les réglages (pied, collision) sont recalés à la nouvelle taille,
// chaque objet posé garde son pied au même endroit (milieu bas). Un PNG du dépôt hors assets/cartes/objets
// devient une copie dans assets/cartes/objets, pour ne pas changer les autres décors du jeu.
let visTarget = null;
$('fileVis').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; const m = visTarget; visTarget = null; if (!f || !m) return;
  const blob = f.type === 'image/png' ? f : await toPng(f), img = await blobToImg(blob);
  commit();
  const kx = img.width / m.img.width, ky = img.height / m.img.height, oldSrc = m.src;
  m.base = Math.round(m.base * ky); m.poly = m.poly.map(([x, y]) => [Math.round(x * kx), Math.round(y * ky)]); if (m.pied) m.pied = m.pied.map(([x, y]) => [Math.round(x * kx), Math.round(y * ky)]);
  if (!m.src.startsWith('assets/cartes/objets/')) { let base = slug(m.src.split('/').pop()), src = `assets/cartes/objets/${base}.png`, n = 2; while (MODELS.has(src)) src = `assets/cartes/objets/${base}_${n++}.png`; MODELS.delete(m.src); m.src = src; MODELS.set(src, m); }
  m.img = img; m.mask = mask(img); m.blob = blob; m.url = img.src; m.isNew = true; m.edited = true;
  await idbPut('models', m.src, modelRecord(m));
  let n = 0;
  for (const o of S ? S.objets : []) {
    if (o.src !== oldSrc) continue; n++;
    const W0 = o.w * o.s, cxw = o.x + W0 / 2, by = o.base, W1 = img.width * o.s;
    const sx = (x) => cxw + (x - cxw) * kx, sy = (y) => by + (y - by) * ky;
    o.poly = o.poly.map(([x, y]) => [Math.round(sx(x)), Math.round(sy(y))]); if (o.pied) o.pied = o.pied.map(([x, y]) => [Math.round(sx(x)), Math.round(sy(y))]);
    o.y = Math.round(sy(o.y)); o.x = Math.round(cxw - W1 / 2); o.w = img.width; o.h = img.height; o.src = m.src;
  }
  renderLeft(); renderInsp(); autosave();
  toast(`Visuel de « ${m.nom} » mis à jour` + (n ? ` (${n} sur la carte)` : ''));
};

// ---------- fond ----------
$('fileFond').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f) setFond(f); };
async function setFond(f) {
  let img; try { img = await blobToImg(f); } catch (_) { return toast('Image illisible : ' + f.name); }
  if (!S) { const c = Math.round(img.width / 32), r = Math.round(img.height / 32); setDoc(newDoc(slug(f.name), f.name.replace(/\.[^.]+$/, ''), c, r), img, f.type === 'image/png' ? f : await toPng(f)); return toast(`Nouvelle carte ${c}×${r} cases créée avec ce fond`); }
  commit(); FOND = img; fondBlob = f.type === 'image/png' ? f : await toPng(f);
  const c = Math.round(img.width / 32), r = Math.round(img.height / 32);
  if (c !== S.cols || r !== S.rows) { if (confirmResize(c, r)) resizeDoc(c, r); else toast('Fond étiré à la taille de la carte'); }
  renderInsp(); autosave(); toast('Fond chargé');
}
function confirmResize(c, r) { return true; } // la taille suit toujours le fond
function resizeDoc(c, r) { S.grille = Array.from({ length: r }, (_, y) => Array.from({ length: c }, (_, x) => (S.grille[y] || '')[x] || '.').join('')); S.cols = c; S.rows = r; $('docname').textContent = `${S.name} · ${S.id} · ${c}×${r} cases`; fit(); toast(`Carte réglée sur le fond : ${c}×${r} cases`); }

// ---------- nouvelle carte ----------
$('bNew').onclick = () => { $('nId').value = ''; $('nName').value = ''; $('nFond').value = ''; $('dlgNew').showModal(); };
$('nGo').onclick = async () => {
  const id = slug($('nId').value || 'carte'), name = $('nName').value || id; let cols = +$('nCols').value || 64, rows = +$('nRows').value || 48, img = null, blob = null;
  const f = $('nFond').files[0]; if (f) { try { img = await blobToImg(f); } catch (_) { return toast('Image illisible : ' + f.name); } blob = f.type === 'image/png' ? f : await toPng(f); cols = Math.round(img.width / 32); rows = Math.round(img.height / 32); }
  $('dlgNew').close(); setDoc(newDoc(id, name, cols, rows), img, blob);
};

// ---------- ouvrir ----------
$('bOpen').onclick = async () => {
  const B = $('openBody'); B.innerHTML = '<p class="small">Chargement…</p>'; $('dlgOpen').showModal();
  const drafts = await idbAll('docs').catch(() => ({})); let repo = [];
  try { repo = await fetch(ROOT + 'assets/cartes/index.json', { cache: 'no-store' }).then(r => r.json()); } catch (_) {}
  B.innerHTML = '';
  const sec = (t, items) => { B.insertAdjacentHTML('beforeend', `<div class="sect">${t}</div>`); const L = document.createElement('div'); L.className = 'list'; if (!items.length) L.innerHTML = '<p class="small">Rien pour l\'instant.</p>'; for (const [label, sub, fn, del] of items) { const r = document.createElement('div'); r.className = 'row'; const b = document.createElement('button'); b.className = 'btn'; b.style.flex = '1'; b.innerHTML = `<span>${esc(label)}</span><small>${esc(sub)}</small>`; b.onclick = async () => { $('dlgOpen').close(); await fn(); }; r.appendChild(b); if (del) { const x = document.createElement('button'); x.className = 'btn dan'; x.textContent = '✕'; x.title = 'Supprimer le brouillon'; x.onclick = async () => { await idbDel('docs', del); r.remove(); }; r.appendChild(x); } L.appendChild(r); } B.appendChild(L); };
  sec('Brouillons (dans ce navigateur)', Object.entries(drafts).sort((a, b) => b[1].at - a[1].at).map(([k, d]) => [d.state.name || k, new Date(d.at).toLocaleString('fr-FR'), async () => setDoc(d.state, d.fond ? await blobToImg(d.fond) : null, d.fond), k]));
  sec('Cartes du jeu (dépôt)', repo.map(id => [id, 'assets/cartes/' + id, () => openRepo(id)]));
  sec('Cartes peintes à refaire', GAME_MAPS.map(([k, zone, nom]) => [nom, `fond actuel + collisions de ${k}`, () => openPainted(k, zone, nom)]));
  B.insertAdjacentHTML('beforeend', `<div class="sect">Fichier</div>`); const r = document.createElement('div'); r.className = 'row'; r.innerHTML = '<button class="btn">Importer un zip exporté…</button>'; r.firstChild.onclick = () => { $('dlgOpen').close(); $('fileZip').click(); }; B.appendChild(r);
};
async function openRepo(id) {
  const C = await fetch(`${ROOT}assets/cartes/${id}/carte.json`, { cache: 'no-store' }).then(r => r.json());
  const blob = await fetch(`${ROOT}assets/cartes/${id}/${C.fond}`, { cache: 'no-store' }).then(r => r.blob());
  for (const src of (C.ponts || []).flatMap(p => [p.bg, p.fg, p.leve]).filter(Boolean)) if (!MODELS.has(src)) await addModel({ src, nom: src.split('/').pop(), cat: 'Ponts', s: 0.5, fade: false });
  for (const o of C.objets) if (!MODELS.has(o.src)) await addModel({ src: o.src, nom: o.src.split('/').pop(), cat: 'Décor', s: o.s, fade: o.fade });
  delete C.fond; setDoc(C, await blobToImg(blob), blob);
}
let mapsLoaded = null;
function loadMapsJs() { return mapsLoaded || (mapsLoaded = new Promise((ok, ko) => { const s = document.createElement('script'); s.src = ROOT + 'src/maps.js?' + Date.now(); s.onload = ok; s.onerror = ko; document.head.appendChild(s); })); }
async function openPainted(k, zone, nom) {
  await loadMapsJs();
  const rows = (typeof PAINTED !== 'undefined' && PAINTED[k]) || null; if (!rows) return toast('Grille introuvable');
  const blob = await fetch(`${ROOT}assets/maps/${k}.png`).then(r => r.blob()), img = await blobToImg(blob);
  const doc = newDoc(zone, nom, rows[0].length, rows.length), groups = {};
  doc.grille = rows.map((r, y) => r.split('').map((t, x) => { if (/[0-9GFEHJKMNO]/.test(t)) { const g = groups[t] = groups[t] || { x0: x, y0: y, x1: x, y1: y }; g.x0 = Math.min(g.x0, x); g.y0 = Math.min(g.y0, y); g.x1 = Math.max(g.x1, x); g.y1 = Math.max(g.y1, y); return '.'; } return t === '~' ? '~' : SOLID.has(t) ? '#' : '.'; }).join(''));
  for (const [t, g] of Object.entries(groups)) doc.sorties.push({ tx: g.x0, ty: g.y0, tw: g.x1 - g.x0 + 1, th: g.y1 - g.y0 + 1, vers: '', arrivee: '', ancien: t });
  setDoc(doc, img, blob); toast('Sorties reprises de l\'ancienne grille : complète leur destination');
}
$('fileZip').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const z = await JSZip.loadAsync(f), cj = Object.keys(z.files).find(n => /assets\/cartes\/[^/]+\/carte\.json$/.test(n)); if (!cj) return toast('Pas de carte dans ce zip');
  const C = JSON.parse(await z.file(cj).async('string')), dir = cj.replace(/carte\.json$/, '');
  for (const n of Object.keys(z.files)) if (/^assets\/cartes\/objets\/[^/]+\.png$/.test(n) && !MODELS.has(n)) { const b = await z.file(n).async('blob'); const m = await addModel({ src: n, nom: n.split('/').pop().replace('.png', ''), cat: 'Décor', s: 0.5, fade: true, url: URL.createObjectURL(b), blob: b, isNew: true }); if (m) await idbPut('models', n, modelRecord(m)); }
  const fb = z.file(dir + (C.fond || 'fond.png')); const blob = fb ? new Blob([await fb.async('arraybuffer')], { type: 'image/png' }) : null;
  delete C.fond; setDoc(C, blob ? await blobToImg(blob) : null, blob); renderLeft();
};

// ---------- export ----------
$('bExport').onclick = async () => {
  if (!S) return toast('Aucune carte');
  if (!fondBlob) return toast('Charge d\'abord un fond');
  const z = new JSZip(), base = `assets/cartes/${S.id}/`, C = JSON.parse(JSON.stringify(S));
  C.fond = 'fond.png'; for (const o of C.objets) delete o._a; for (const s of C.sorties) delete s.ancien;
  z.file(base + 'carte.json', JSON.stringify(C, null, 1));
  z.file(base + 'fond.png', fondBlob);
  // bibliothèque partagée : modèles nouveaux ou retouchés
  let lib = []; try { lib = await fetch(ROOT + 'assets/cartes/objets/index.json', { cache: 'no-store' }).then(r => r.json()); } catch (_) {}
  lib = lib.filter(x => !REMOVED.has(x.src) || MODELS.has(x.src));
  for (const m of MODELS.values()) {
    if (!(m.isNew || m.edited)) continue;
    if (m.isNew && m.blob) z.file(m.src, m.blob);
    const rec = { src: m.src, nom: m.nom, cat: m.cat, s: m.s, base: m.base, poly: m.poly, lumiere: m.lumiere || undefined, pied: m.pied || undefined, fade: !!m.fade }, i = lib.findIndex(x => x.src === m.src);
    if (i >= 0) lib[i] = rec; else lib.push(rec);
  }
  z.file('assets/cartes/objets/index.json', JSON.stringify(lib, null, 1));
  let ids = []; try { ids = await fetch(ROOT + 'assets/cartes/index.json', { cache: 'no-store' }).then(r => r.json()); } catch (_) {}
  if (!ids.includes(S.id)) ids.push(S.id); z.file('assets/cartes/index.json', JSON.stringify(ids));
  const out = await z.generateAsync({ type: 'blob' }), a = document.createElement('a');
  a.href = URL.createObjectURL(out); a.download = `carte_${S.id}.zip`; document.body.appendChild(a); a.click(); a.remove();
  toast(`carte_${S.id}.zip prêt : envoie-le à Claude`);
};

$('bFondTop').onclick = () => $('fileFond').click();
$('bUndo').onclick = doUndo; $('bRedo').onclick = doRedo;
for (const id of ['vCol', 'vBase', 'vGrid']) $(id).onchange = () => {};
addEventListener('resize', () => { resize(); });
let last = performance.now();
function loop(t) { const dt = Math.min(0.05, (t - last) / 1000); last = t; if (mode === 'test' && S) heroStep(dt); draw(); requestAnimationFrame(loop); }
resize(); renderLeft(); renderInsp(); loadLibrary(); requestAnimationFrame(loop);
// reprendre le dernier brouillon
idbAll('docs').then(async d => { const e = Object.values(d).sort((a, b) => b.at - a.at)[0]; if (e && !S) setDoc(e.state, e.fond ? await blobToImg(e.fond) : null, e.fond); }).catch(() => {});
</script>
